        const bh = Math.max(1, v * amp);
        tctx.fillRect(x, mid - bh, bw, bh * 2);
      }
      tctx.globalAlpha = 1;
    }
    if (P.lyrics) {
      tctx.fillStyle = css.acc;
      const y = h - Math.max(3, h * 0.09);
      for (const l of P.lyrics.lines) {
        tctx.globalAlpha = t >= l.begin && t <= l.end ? 1 : 0.55;
        tctx.fillRect(px(l.begin), y, Math.max(2, px(l.end) - px(l.begin) - 1), Math.max(3, h * 0.09));
      }
      tctx.globalAlpha = 1;
    }
    tctx.fillStyle = css.fg;
    tctx.fillRect(Math.round(px(t)) - 1, 0, 2, h);
  }
  let prepBusy = false;
  function loop() {
    requestAnimationFrame(loop);
    if (X.busy) return;
    if (!playing && !dirty) return;
    dirty = false;
    let t = now();
    // an edit or a promo plays its fragment around in a loop
    if (playing && S.mode !== 'lyric') { const [a, b] = exRange(); if (t >= b) { seek(a); t = a; } }
    if (Render.needsPrep(P, S) && !prepBusy) { prepBusy = true; Render.prepare(P, S, t).then(() => { prepBusy = false; touch(); }, () => { prepBusy = false; }); }
    Render.frame(pctx, pv.width, pv.height, t, P, S, exRange());
    drawMarkGuide(pv, pctx);
    drawTimeline(t);
    $('#tcur').textContent = fmt(t, true);
    $('#tl').setAttribute('aria-valuenow', String(Math.round((t / (P.dur || 1)) * 100)));
  }

  /* ---- presets ---- */
  function applyPreset(p) {
    const keep = { export: clone(S.export), aspect: S.frame.aspect, mark: clone(S.mark), qr: clone(S.qr), mode: S.mode, seg: clone(S.seg), badges: clone(S.badges), promo: clone(S.promo), clips: clone(S.clips), thumb: clone(S.thumb), end: clone(S.end) };
    S = merge(merge(clone(DEFAULTS), clone(MODE_BASE[keep.mode] || {})), clone(p.v));
    S.export = keep.export; S.mark = keep.mark; S.qr = keep.qr; S.mode = keep.mode; S.seg = keep.seg; S.badges = keep.badges; S.thumb = keep.thumb;
    S.frame.aspect = keep.aspect;
    if (keep.mode !== 'promo') S.end = merge(keep.end, {});
    else Object.assign(S.end, { artistSocials: keep.end.artistSocials, labelSocials: keep.end.labelSocials, artistTitle: keep.end.artistTitle, labelTitle: keep.end.labelTitle });
    // a promo style changes the animation, not the words already typed in
    if (keep.mode === 'promo') S.promo = promoAnim(keep.promo, p.v.promo || {});
    if (keep.mode === 'edit') S.clips = Object.assign(clone(DEFAULTS.clips), { seed: keep.clips.seed }, (p.v.clips || {}));
    activePreset = p.id;
    store.set('strofa.preset', p.id);
    Render.invalidate();
    syncUI(); loadFaces(); sizePreview(); changed(true);
  }
  function randomLook() {
    const pick = (a) => a[Math.floor(Math.random() * a.length)];
    const rnd = (a, b) => Math.round((a + Math.random() * (b - a)) * 100) / 100;
    const font = pick(FONTS);
    const heavy = font[1] ? font[1].filter((w) => w >= 600) : [400];
    const style = pick(['list', 'list', 'karaoke', 'line', 'line', 'poster', 'word']);
    const layout = style === 'poster' || style === 'word' ? pick(['text', 'mini']) : pick(['side', 'side', 'center', 'mini', 'text']);
    if (S.mode !== 'lyric') { const L = stylesFor(S.mode); applyPreset(L[Math.floor(Math.random() * L.length)]); return; }
    applyPreset({ id: 'random', v: {
      frame: { layout, coverShape: pick(['round', 'round', 'square', 'circle', 'vinyl']), coverTilt: Math.random() < 0.25 ? Math.round(rnd(-6, 6)) : 0, coverBorder: Math.random() < 0.2 ? 0.5 : 0, progStyle: pick(['line', 'wave', 'dots']) },
      bg: { style: pick(['cover', 'cover', 'fluid', 'gradient', 'grid', 'aurora', 'tunnel', 'waves', 'dots', 'kaleido', 'rays', 'eq', 'stripes', 'warp']), blur: rnd(0.3, 0.9), dim: rnd(0.25, 0.55), grain: rnd(0, 0.35), speed: rnd(0.4, 1.2), shape: pick(['circle', 'tri', 'square', 'hex']), segments: Math.round(rnd(4, 9)), scan: Math.random() < 0.15 ? 0.3 : 0 },
      text: { style, wordIn: pick(['pop', 'rise', 'fade', 'type', 'all']), font: font[0], weight: pick(heavy.length ? heavy : font[1]), upper: Math.random() < 0.3, sung: pick(['text', 'accent', 'accent']), glow: rnd(0, 0.7), plate: Math.random() < 0.2 ? 0.7 : 0, anchor: style === 'poster' || style === 'word' || layout === 'text' ? 0.5 : 0.4, align: layout === 'side' ? 'auto' : 'center' },
      beat: { viz: pick(['none', 'none', 'bars', 'mirror', 'ring', 'wave', 'scope', 'led', 'peaks', 'dotgrid', 'radial', 'curve', 'circles']), particles: pick(['none', 'dust', 'snow', 'bokeh', 'stars', 'sparks', 'confetti', 'rain', 'fireflies', 'bubbles', 'notes']), punch: rnd(0, 0.6), shake: Math.random() < 0.2 ? rnd(0.1, 0.4) : 0, flash: rnd(0, 0.3), rgb: Math.random() < 0.2 ? rnd(0.2, 0.6) : 0, textBounce: rnd(0, 0.5) },
    } });
  }
  function markPreset() {
    document.querySelectorAll('#looks .chip').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.id === activePreset)));
    const name = $('#lookName');
    if (name) {
      const L = stylesFor(S.mode);
      const i = L.findIndex((p) => p.id === activePreset);
      name.textContent = i >= 0 ? L[i].name : activePreset === 'random' ? 'Случайный' : 'Свой';
      $('#lookPos').textContent = i >= 0 ? `${i + 1} / ${L.length}` : '';
      const drop = $('#dropStyle');
      if (drop) drop.hidden = !String(activePreset).startsWith('my-');
    }
  }
  function stepLook(dir) {
    const L = stylesFor(S.mode);
    const i = L.findIndex((p) => p.id === activePreset);
    const n = L.length;
    applyPreset(L[i < 0 ? (dir > 0 ? 0 : n - 1) : (i + dir + n) % n]);
  }

  /* ---- switching what is being made; each mode keeps its own settings ---- */
  let tabShow = null, curTab = 'track';
  function applyModeUI() {
    document.querySelectorAll('#modes button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === S.mode)));
    let curHidden = false;
    document.querySelectorAll('#tabs .tab').forEach((b) => {
      const on = (b.dataset.modes || '').split(' ').includes(S.mode);
      b.hidden = !on;
      if (!on && b.id === 'tab-' + curTab) curHidden = true;
    });
    if (curHidden && tabShow) tabShow('track');
    document.documentElement.dataset.mode = S.mode;
  }
  function setMode(m) {
    if (m === S.mode || X.busy) return;
    pause();
    store.set('strofa.mode.' + S.mode, { S: clone(S), preset: activePreset });
    const keep = { export: clone(S.export), mark: clone(S.mark), qr: clone(S.qr), badges: clone(S.badges), thumb: clone(S.thumb), soc: socKeep() };
    const saved = store.get('strofa.mode.' + m);
    if (saved && saved.S) {
      S = merge(clone(DEFAULTS), saved.S);
      activePreset = saved.preset || '';
      S.mode = m;
    } else {
      S.mode = m;
      applyPreset(stylesFor(m)[0]);
      if (m !== 'lyric') S.frame.aspect = '9:16';
      if (m === 'edit') S.end.on = false; // a short edit ends on the music; the finale is one switch away
    }
    S.export = keep.export; S.mark = keep.mark; S.qr = keep.qr; S.badges = keep.badges; S.thumb = keep.thumb;
    Object.assign(S.end, keep.soc);
    if (m === 'edit' && !P.clips.length) demoClips().then(() => touch());
    store.set('strofa.preset', activePreset);
    Render.invalidate();
    syncUI(); loadFaces(); sizePreview(); changed(true);
    if (m !== 'lyric') seekSeg();
    toast(m === 'edit' ? 'Эдит: короткое вертикальное видео на ваших клипах, смена кадров в такт.' : m === 'promo' ? 'История к релизу: обложка двигается в бит, для сторис и постов.' : 'Лирик-видео на весь трек.', 5000);
  }

  /* ---- build ---- */
  function build() {
    const tabs = $('#tabs'), body = $('#tabbody');
    const panes = {};
    const show = (id) => {
      for (const k in panes) panes[k].pane.hidden = k !== id;
      for (const k in panes) panes[k].btn.setAttribute('aria-selected', String(k === id));
      store.set('strofa.tab', id);
      curTab = id;
      if (id === 'export') { updateEstimate(); drawThumbPreview(); }
    };
    // what is being made: a lyric video, an edit, a release promo
    const modeBox = el('div', { class: 'seg modes', id: 'modes', role: 'group', 'aria-label': 'Что делаем' });
    MODES.forEach(([id, name]) => { const b = el('button', { type: 'button', text: name, onclick: () => setMode(id) }); b.dataset.v = id; modeBox.append(b); });
    tabs.parentNode.insertBefore(modeBox, tabs);
    tabShow = show;
    TABS.forEach((tab) => {
      const btn = el('button', { class: 'tab', type: 'button', role: 'tab', id: 'tab-' + tab.id, text: tab.name, onclick: () => show(tab.id) });
      btn.dataset.modes = (tab.modes || ['lyric', 'edit', 'promo']).join(' ');
      const pane = el('div', { role: 'tabpanel', 'aria-labelledby': 'tab-' + tab.id, style: 'display:flex;flex-direction:column;gap:14px' });
      if (tab.id === 'track') buildTrackTab(pane);
      else if (tab.id === 'export') buildExportTab(pane);
      else tab.groups.forEach((g) => {
        const ge = el('div', { class: 'group' }, el('h3', { text: g.title }));
        g.fields.forEach((f) => ge.append(field(f)));
        groupEls.push({ el: ge, show: g.show, modes: g.modes });
        pane.append(ge);
      });
      panes[tab.id] = { btn, pane };
      tabs.append(btn);
      body.append(pane);
    });
    const hash = (location.hash || '').replace('#', '');
    show(panes[hash] ? hash : panes[store.get('strofa.tab')] ? store.get('strofa.tab') : 'track');
    const looks = $('#looks');
    const arrow = (d, label, path) => {
      const b = el('button', { type: 'button', 'aria-label': label, title: label, onclick: () => stepLook(d) });
      b.innerHTML = `<svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="${path}" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      return b;
    };
    looks.append(el('div', { class: 'stepper', role: 'group', 'aria-label': 'Переключение стиля' },
      arrow(-1, 'Предыдущий стиль', 'M12.5 4.5 7 10l5.5 5.5'),
      el('span', { class: 'cur', 'aria-live': 'polite' }, el('b', { id: 'lookName', text: '' }), el('i', { id: 'lookPos', text: '' })),
      arrow(1, 'Следующий стиль', 'M7.5 4.5 13 10l-5.5 5.5')));
    looks.append(el('button', { class: 'chip', type: 'button', id: 'allStyles', text: 'Все стили', title: 'Галерея всех стилей этого режима на вашем треке', onclick: openGallery }));
    looks.append(el('button', { class: 'chip dice', type: 'button', 'data-id': 'random', text: 'Случайный', title: 'Собрать случайное сочетание сцены, текста и эффектов', onclick: randomLook }));
    looks.append(el('button', { class: 'chip', type: 'button', id: 'saveStyle', text: 'Сохранить стиль', title: 'Запомнить текущие настройки как свой стиль', onclick: saveMyStyle }));
    looks.append(el('button', { class: 'chip', type: 'button', id: 'dropStyle', text: 'Удалить стиль', hidden: true, onclick: dropMyStyle }));
  }
  const hostTheme = document.documentElement.getAttribute('data-theme');
  function setTheme(mode, save) {
    const root = document.documentElement;
    if (mode === 'dark' || mode === 'light') root.setAttribute('data-theme', mode);
    else if (hostTheme) root.setAttribute('data-theme', hostTheme);
    else root.removeAttribute('data-theme');
    document.querySelectorAll('#theme button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === mode)));
    if (save) store.set('strofa.theme', mode);
    readCss();
  }
  function buildTheme() {
    const box = $('#theme');
    [['auto', 'Авто'], ['light', 'Светлая'], ['dark', 'Тёмная']].forEach(([v, n]) => box.append(el('button', { type: 'button', 'data-v': v, text: n, onclick: () => setTheme(v, true) })));
    const saved = store.get('strofa.theme');
    setTheme(saved === 'dark' || saved === 'light' ? saved : 'auto', false);
  }
  let dragDepth = 0;
  function hideDrop() { dragDepth = 0; $('#dropHint').hidden = true; }
  function wire() {
    $('#play').addEventListener('click', () => (playing ? pause() : play()));
    $('#fsBtn').addEventListener('click', fsToggle);
    wireMarkDrag();
    $('#preview').addEventListener('dblclick', fsToggle);
    document.addEventListener('fullscreenchange', fsSync);
    document.addEventListener('webkitfullscreenchange', fsSync);
    $('.screen').addEventListener('pointermove', fsWake);
    $('.screen').addEventListener('pointerdown', fsWake);
    document.addEventListener('keydown', (e) => {
      const tag = (e.target.tagName || '').toLowerCase();
      if (e.code === 'KeyF' && !e.metaKey && !e.ctrlKey && !e.altKey && !['input', 'textarea', 'select'].includes(tag) && !document.querySelector('dialog[open]')) { e.preventDefault(); fsToggle(); }
      if (e.key === 'Escape' && $('.screen').classList.contains('fs')) { e.preventDefault(); fsExit(); }
      if (fsOn) fsWake();
      if (e.code === 'Space' && !['input', 'textarea', 'select', 'button'].includes(tag)) { e.preventDefault(); playing ? pause() : play(); }
      if ((e.code === 'BracketLeft' || e.code === 'BracketRight') && !['input', 'textarea', 'select'].includes(tag) && !X.busy) stepLook(e.code === 'BracketLeft' ? -1 : 1);
    });
    const tl = $('#tl');
    let scrub = false, resume = false;
    const at = (e) => { const r = tl.getBoundingClientRect(); return clamp((e.clientX - r.left) / r.width) * P.dur; };
    let segDrag = null;
    tl.addEventListener('pointerdown', (e) => {
      if (X.busy) return;
      tl.setPointerCapture(e.pointerId);
      // an edit or a story: the lit fragment moves, its edges resize it
      segDrag = segDragAt(e, tl);
      if (segDrag && segDrag.mode !== 'move') { e.preventDefault(); return; }
      scrub = true; resume = playing; if (playing) pause(); offset = at(e); touch();
    });
    tl.addEventListener('pointermove', (e) => {
      if (segDrag) { if (segDragMove(segDrag, e)) { scrub = false; } return; }
      if (scrub) { offset = at(e); touch(); return; }
      const d = e.pointerType === 'mouse' ? segDragAt(e, tl) : null;
      tl.style.cursor = d ? (d.mode === 'move' ? 'grab' : 'ew-resize') : '';
    });
    const up = () => {
      if (segDrag) {
        const d = segDrag; segDrag = null;
        if (d.mode !== 'move' || d.moved) { changed(true); seekSeg(); return; }
      }
      if (!scrub) return; scrub = false; if (resume) play();
    };
    tl.addEventListener('pointerup', up);
    tl.addEventListener('pointercancel', up);
    tl.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') seek(now() + 2);
      else if (e.key === 'ArrowLeft') seek(now() - 2);
      else if (e.key === 'Home') seek(0);
    });
    window.addEventListener('dragenter', (e) => { if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files')) { dragDepth++; $('#dropHint').hidden = false; } });
    window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $('#dropHint').hidden = true; });
    window.addEventListener('dragover', (e) => e.preventDefault());
    window.addEventListener('drop', (e) => { e.preventDefault(); hideDrop(); if (e.dataTransfer && e.dataTransfer.files.length) routeFiles(e.dataTransfer.files); });
    if (window.ResizeObserver) new ResizeObserver(sizePreview).observe($('#viewer'));
    window.addEventListener('resize', sizePreview);
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', readCss);
    new MutationObserver(readCss).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  }

  async function start() {
    build();
    wire();
    buildTheme();
    $('#acct').addEventListener('click', () => openSheet(AC.me ? 'profile' : 'profile'));
    wireSync();
    $('#helpBtn').addEventListener('click', () => openSheet('help'));
    $('#sheetClose').addEventListener('click', closeSheet);
    sheet().addEventListener('close', () => { AC.open = false; });
    sheet().addEventListener('click', (e) => { if (e.target === sheet()) closeSheet(); });
    P.title = 'Фонари'; P.artist = 'talk with a star'; P.demoMeta = true;
    P.prod = store.get('strofa.prod') || '';
    const prEl = $('#m-prod');
    if (prEl) prEl.value = P.prod;
    setCover(demoCover(), 'demo', true);
    const lg = new Image();
    lg.onload = () => { P.logoDefault = lg; if (!P.logo) { P.logo = lg; P.logoId = seq++; touch(); } refreshLogoThumb(); };
    lg.src = LOGO_SRC;
    const bl = $('#brandLogo');
    bl.style.webkitMaskImage = bl.style.maskImage = `url(${LOGO_SRC})`;
    bl.classList.add('ready');
    updateQR();
    syncUI(); syncMeta();
    sizePreview();
    if (!RENDER_JOB) loadMyBadges();
    setLyrics(demoTTML(), 'demo.ttml', true);
    offset = 11.2;
    requestAnimationFrame(loop);
    probeSupport();
    if (RENDER_JOB) { serverJob(); return; }
    acctInit();
    await setAudio(demoAudio(), 'demo', true);
    offset = 11.2;
    if (S.mode === 'edit') demoClips();
    if (S.mode !== 'lyric') { const [a, b] = segRange(); offset = Math.min(b - 0.1, a + Math.min(1.2, (b - a) * 0.1)); }
    touch();
    // links from the bot and the front page
    if (location.hash === '#ttml') openSync();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();

</script>
